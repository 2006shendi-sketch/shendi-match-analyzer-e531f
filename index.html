<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b0e">
<title>SHENDi AI | محلل المباريات</title>
<style>
:root{color-scheme:dark;--bg:#090b0e;--p:#151a21;--line:#303945;--text:#f4f7fa;--muted:#aab4c0;--a:#d7ff35}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#1d2a34,transparent 35%),var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif;line-height:1.7}.wrap{max-width:850px;margin:auto;padding:18px 13px 40px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}.logo{width:50px;height:50px;border:2px solid var(--a);border-radius:15px;display:grid;place-items:center;color:var(--a);font-size:27px;font-weight:bold}h1{font-size:22px;margin:0}.muted,.note{color:var(--muted);font-size:13px}.panel,.hero{background:var(--p);border:1px solid var(--line);border-radius:18px;padding:17px;margin:13px 0}.hero{background:linear-gradient(140deg,#19232b,#101317)}.tag{color:var(--a);font-weight:bold;font-size:12px}.hero h2{margin:8px 0;font-size:23px}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.upload{display:block;padding:24px 12px;border:1px dashed #596573;border-radius:14px;text-align:center;background:#0b0e12;cursor:pointer}.upload input{display:none}.preview{max-width:100%;max-height:330px;display:none;margin:12px auto;border-radius:12px}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:var(--a);color:#101010;font-size:16px;font-weight:bold;margin-top:10px;cursor:pointer}.btn:disabled{opacity:.55}.status{color:#a9d7ff;font-size:13px;min-height:22px;margin-top:8px}.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b0e12;border:1px solid #3a4652;border-radius:12px;padding:14px;margin-top:12px}.footer{text-align:center;color:#7c8794;font-size:12px;margin-top:22px}@media(max-width:500px){.panel{padding:13px}.hero h2{font-size:21px}}
</style></head>
<body><main class="wrap">
<header class="brand"><div class="logo">S</div><div><h1>SHENDi AI</h1><div class="muted">محلّل مباريات كرة القدم</div></div></header>
<section class="hero"><span class="tag">MATCH CENTER</span><h2>ارفع الصورة فقط ودع SHENDi AI يحلّل ⚽</h2><p class="muted">بدون إدخال أسماء الفرق أو الأهداف أو الملعب. إذا كانت المعلومة غير ظاهرة أو لا تتوفر بيانات موثوقة، لن نخترعها.</p></section>
<section class="panel"><h3>صورة المباراة</h3>
<label class="upload" for="img"><strong>📷 اضغط هنا لاختيار صورة المباراة</strong><div class="muted">صورة أو لقطة شاشة من جهازك</div><input id="img" type="file" accept="image/*"></label>
<img class="preview" id="preview" alt="معاينة الصورة">
<button class="btn" id="analyze">✨ حلّل الصورة</button><div class="status" id="status" aria-live="polite">اختَر الصورة ثم اضغط «حلّل الصورة».</div><div id="result" class="result" hidden></div></section>
<div class="footer">SHENDi AI · التوقعات احتمالية وليست ضماناً</div></main>
<script>
const input=document.getElementById('img'),preview=document.getElementById('preview');
input.addEventListener('change',()=>{if(input.files&&input.files[0]){preview.src=URL.createObjectURL(input.files[0]);preview.style.display='block';}});
function toBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file);});}
document.getElementById('analyze').addEventListener('click',async()=>{const file=input.files&&input.files[0],status=document.getElementById('status'),result=document.getElementById('result'),button=document.getElementById('analyze');if(!file){status.textContent='اختَر صورة أولاً.';return;}button.disabled=true;result.hidden=true;status.textContent='جاري تحليل الصورة بالذكاء الاصطناعي…';try{const response=await fetch('/.netlify/functions/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mimeType:file.type||'image/jpeg',image:await toBase64(file)})});let data={};try{data=await response.json();}catch{}if(!response.ok)throw new Error(data.error||('فشل الخادم (HTTP '+response.status+'). افتح Netlify Deploys وتأكد أن آخر نسخة Published.'));if(!data.text)throw new Error('لم يصل تحليل. جرّب صورة أوضح.');result.textContent=data.text;result.hidden=false;status.textContent='اكتمل التحليل. راجع المعلومات؛ التوقع ليس ضماناً.';}catch(error){status.textContent='تعذر التحليل: '+(error.message||'خطأ غير معروف');}finally{button.disabled=false;}});
</script></body></html>
